<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masa Ini, Nanti, dan Masa Indah Lainnya — Nuca</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600;1,700;1,800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#050506; --card:#17171d; --dim:#9a9aa2; --accent:#e58ea2; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--bg);color:#e8e8ea;font-family:'Inter',system-ui,sans-serif;overflow:hidden}

  #bg{
    position:fixed; inset:-30%; z-index:0; opacity:0; transition:opacity 2.5s ease;
    display:grid; grid-template-columns:repeat(4,1fr); grid-template-rows:repeat(3,1fr);
    gap:15px; padding:15px;
    filter:blur(12px) brightness(.25) saturate(.6);
    animation:bgFlow 12s linear infinite alternate; 
    will-change: transform;
  }
  #bg img{ width:100%; height:100%; object-fit:cover; border-radius:4px; }
  @keyframes bgFlow{
    0% { transform: translate(-5%, -8%) scale(1.05); }
    100% { transform: translate(5%, 8%) scale(1.25); }
  }
  body.started #bg{opacity:1}

  #fx-canvas{ position:fixed; inset:0; z-index:3; pointer-events:none; }

  .mini-photo{
    position:fixed; z-index:8; object-fit:cover; border-radius:10px;
    border:1px solid rgba(255,255,255,.45);
    box-shadow:0 6px 18px rgba(0,0,0,.55);
    pointer-events:none;
    transition:left 1.5s cubic-bezier(.45,.05,.2,1), top 1.5s cubic-bezier(.45,.05,.2,1),
               width 1.5s cubic-bezier(.45,.05,.2,1), height 1.5s cubic-bezier(.45,.05,.2,1);
  }

  #stage{position:fixed;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;pointer-events:none}

  .scene{
    position:absolute; display:flex; flex-direction:column; align-items:center; gap:16px;
    opacity:1; will-change: transform, opacity, filter;
  }
  .scene.enter{ animation:smoothEnter 1.8s cubic-bezier(.3,.7,.3,1) both; }
  .scene.exit{ animation:smoothExit 1.8s cubic-bezier(.4,0,.6,1) forwards; }
  @keyframes smoothEnter{
    0% { opacity:0; transform:translateY(24px) scale(.97); filter:blur(6px); }
    100% { opacity:1; transform:translateY(0) scale(1); filter:blur(0); }
  }
  @keyframes smoothExit{
    0% { opacity:1; transform:translateY(0) scale(1); filter:blur(0); }
    100% { opacity:0; transform:translateY(-16px) scale(1.02); filter:blur(5px); }
  }
  .scene.idle{ opacity:1; animation:breathe 6s ease-in-out infinite; }
  @keyframes breathe{
    0%, 100% { transform:scale(1); }
    50% { transform:scale(1.01); }
  }

  .photo-card{
    border-radius:16px; border:1px solid rgba(255,255,255,.4); overflow:hidden;
    box-shadow:0 12px 50px rgba(0,0,0,.65); background:#111;
  }
  .photo-card img{
    display:block; width:min(480px,72vw); aspect-ratio:4/3; object-fit:cover;
    filter:grayscale(.4) contrast(.95);
  }

  .lyric{
    font-family:'Playfair Display',serif; font-style:italic; font-weight:600;
    color:#b4b4bb; font-size:clamp(15px,2.6vw,24px); text-align:center;
    line-height:1.55; letter-spacing:.4px; max-width:82vw;
  }
  .lyric .w{transition:color .3s ease, text-shadow .3s ease}
  .lyric .w.on{ color:#fff; font-weight:800; text-shadow:0 0 14px rgba(255,255,255,.35); }

  #player{position:fixed;z-index:10;left:50%;top:50%;transform:translate(-50%,-50%);
          width:300px;background:linear-gradient(180deg,#1c1c23,#141419);
          border:1px solid rgba(255,255,255,.07);border-radius:22px;padding:18px;
          box-shadow:0 24px 70px rgba(0,0,0,.75);
          transition:left 1s cubic-bezier(.6,.1,.3,1),transform 1s cubic-bezier(.6,.1,.3,1),width 1s,padding 1s}
  body.started #player{left:14px;top:50%;transform:translateY(-50%) scale(.9);width:185px;padding:12px}

  #cover{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;filter:grayscale(.3)}
  .p-title{font-weight:700;font-size:15px;margin-top:12px}
  .p-artist{color:var(--dim);font-size:12px;margin-top:2px}
  body.started .p-title{font-size:12px;margin-top:8px}
  body.started .p-artist{font-size:10px}

  .p-times{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-top:10px}
  .p-bar{height:3px;background:rgba(255,255,255,.12);border-radius:3px;margin-top:6px;cursor:pointer}
  #barFill{height:100%;width:0%;background:var(--accent);border-radius:3px}

  .p-controls{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
  .ctl{background:none;border:none;color:#cfcfd6;cursor:pointer;padding:4px;display:flex}
  #btnPlay{width:46px;height:46px;border-radius:50%;background:#fff;border:none;cursor:pointer;
           display:flex;align-items:center;justify-content:center;color:#111;
           box-shadow:0 4px 16px rgba(0,0,0,.5)}
  body.started #btnPlay{width:38px;height:38px}
  .p-vol{display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--dim)}
  input[type=range]{width:100%;height:3px;accent-color:#fff}

  #ended{ position:fixed; inset:0; z-index:20; display:none; pointer-events:none; }
  body.ended #ended{display:block}
  #ended .cap{
    position:absolute; left:50%; top:52%;
    transform:translate(-50%,-50%) scale(.85);
    font-family:'Playfair Display',serif; font-style:italic; font-weight:800;
    color:#fff; font-size:clamp(22px,4.5vw,52px);
    letter-spacing:1px; white-space:nowrap;
    text-shadow:0 2px 20px rgba(0,0,0,.9), 0 0 40px rgba(229,142,162,.55);
    opacity:0;
    animation:capIn 1.6s cubic-bezier(.2,.8,.2,1) .9s both;
  }
  @keyframes capIn{
    from{ opacity:0; transform:translate(-50%,-50%) scale(.85); filter:blur(6px); }
    to{ opacity:1; transform:translate(-50%,-50%) scale(1); filter:blur(0); }
  }
  #ended button{
    position:absolute;  right: 5vh; bottom:5vh; transform:translateX(-50%);
    pointer-events:auto; background:#fff; border:none; border-radius:30px;
    padding:12px 26px; font-weight:700; cursor:pointer;
    box-shadow:0 6px 24px rgba(0,0,0,.6);
  }
</style>
</head>
<body>

<div id="bg"></div>
<canvas id="fx-canvas"></canvas>
<div id="stage"></div>

<div id="player">
  <img id="cover" src="" alt="cover">
  <div class="p-title" id="songTitle"></div>
  <div class="p-artist" id="songArtist"></div>
  <div class="p-times"><span id="tCur">0:00</span><span id="tRem">-0:00</span></div>
  <div class="p-bar" id="bar"><div id="barFill"></div></div>
  <div class="p-controls">
    <button class="ctl" id="btnBack" title="mundur 10s">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
    </button>
    <button id="btnPlay"></button>
    <button class="ctl" id="btnFwd" title="maju 10s">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>
    </button>
    <button class="ctl" id="btnMute">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4h4l5 5V5L7 10H3z"/></svg>
    </button>
  </div>
  <div class="p-vol">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4h4l5 5V5L7 10H3z"/></svg>
    <input type="range" id="vol" min="0" max="1" step="0.01" value="0.8">
  </div>
</div>

<div id="ended">
  <div class="cap">I'll ALWAYS BE HERE FOR YOU 💖</div>
  <button id="btnReplay">↺ putar lagi</button>
</div>

<audio id="audio" src="lagu.mp3" preload="metadata"></audio>

<script>
const SONG_TITLE = "Masa Ini, Nanti, dan Masa Indah Lainnya";
const SONG_ARTIST = "Nuca";
const COVER = "https://picsum.photos/seed/nuca/400/400?grayscale"; 

const P = seed => `https://picsum.photos/seed/${seed}/640/480?grayscale`;

const SCENES = [
  { start:0,    end:5.3,  text:"Izinkan ku berjalan bersamamu",    pos:"top",    img:'foto/foto 1.jpeg' },
  { start:5.5,  end:10.6, text:"Mimpi yang telah lama kudambakan", pos:"bottom", img:'foto/foto 2.jpeg' },
  { start:11.5, end:16.9, text:"Kini semua terasa indah",          pos:"top",    img:'foto/foto 3.jpeg' },
  { start:17.0, end:23.2, text:"Hitam putih pun mulai berwarna",   pos:"bottom", img:'foto/foto 4.jpeg' },
  { start:25.0, end:30.8, text:"Kau adalah semua jawaban",         pos:"top",    img:'foto/foto 5.jpeg' },
  { start:31.0, end:35.8, text:"Dari doa yang kupanjatkan",        pos:"bottom", img:'foto/foto 9.jpeg' },
  { start:36.0, end:41.9, text:"Dengan hadirmu di hidupku",        pos:"top",    img:'foto/foto 7.jpeg' },
  { start:42.0, end:46.0, text:"Sudah ku merasa cukup",            pos:"bottom", img:'foto/foto 8.jpeg' },
];

const FIREWORK_START = 21.0;
const FIREWORK_END   = 31.0;

const audio = document.getElementById('audio');
const stage = document.getElementById('stage');
const bg = document.getElementById('bg');
const btnPlay = document.getElementById('btnPlay');
const bar = document.getElementById('bar'), barFill = document.getElementById('barFill');
const tCur = document.getElementById('tCur'), tRem = document.getElementById('tRem');
const canvas = document.getElementById('fx-canvas');
const ctx = canvas.getContext('2d');

const ICON_PLAY  = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
const ICON_PAUSE = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>';

document.getElementById('songTitle').textContent = SONG_TITLE;
document.getElementById('songArtist').textContent = SONG_ARTIST;
document.getElementById('cover').src = COVER;
btnPlay.innerHTML = ICON_PLAY;

function resizeCanvas(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

const bgImgs = [...new Set(SCENES.map(s=>s.img))];
for(let i=0;i<12;i++){
  const img=document.createElement('img');
  img.src=bgImgs[i % bgImgs.length];
  bg.appendChild(img);
}

let started=false, current=-1, activeEl=null, missing=false;
audio.addEventListener('error', ()=>{ missing=true; });

btnPlay.onclick = async ()=>{
  if(missing){ alert('File "lagu.mp3" tidak ditemukan!'); return; }
  if(!started){ started=true; document.body.classList.add('started'); }
  if(audio.paused){ await audio.play(); btnPlay.innerHTML=ICON_PAUSE; }
  else { audio.pause(); btnPlay.innerHTML=ICON_PLAY; }
};

document.getElementById('btnBack').onclick = ()=>{ audio.currentTime=Math.max(0,audio.currentTime-10); };
document.getElementById('btnFwd').onclick  = ()=>{ audio.currentTime=Math.min(audio.duration||0,audio.currentTime+10); };
document.getElementById('btnMute').onclick = ()=>{ audio.muted=!audio.muted; };
document.getElementById('vol').oninput = e=>{ audio.volume=e.target.value; };
bar.onclick = e=>{ if(!isFinite(audio.duration))return;
  const r=bar.getBoundingClientRect();
  audio.currentTime=(e.clientX-r.left)/r.width*audio.duration; };

// ==========================================
// ❤️ KOLEKSI FOTO → LOVE POJOK → LOVE BESAR
// ==========================================
const miniPhotos = [];
const MINI_SIZE = 52;

function heartPoint(t, scale, cx, cy){
  const x = 16 * Math.pow(Math.sin(t), 3);
  const y = 13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t);
  return { x: cx + x*scale, y: cy - y*scale };
}
function cornerSlot(i, n){
  const t = (i / n) * Math.PI * 2;
  return heartPoint(t, 6, window.innerWidth - 130, 130);
}
function bigScale(){
  return Math.max(10, Math.min(24, Math.min(window.innerWidth, window.innerHeight) / 34));
}
function bigSlot(i, n){
  const t = (i / n) * Math.PI * 2;
  return heartPoint(t, bigScale(), window.innerWidth/2, window.innerHeight/2 - 20);
}
function bigSize(){
  return Math.max(70, Math.min(120, bigScale() * 4.5));
}

function spawnMini(imgEl, slotIdx){
  const r = imgEl.getBoundingClientRect();
  const m = document.createElement('img');
  m.src = imgEl.src;
  m.className = 'mini-photo';
  m.style.left = r.left+'px';
  m.style.top = r.top+'px';
  m.style.width = r.width+'px';
  m.style.height = r.height+'px';
  document.body.appendChild(m);
  const slot = cornerSlot(slotIdx, SCENES.length);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    m.style.left = (slot.x - MINI_SIZE/2)+'px';
    m.style.top  = (slot.y - MINI_SIZE/2)+'px';
    m.style.width  = MINI_SIZE+'px';
    m.style.height = MINI_SIZE+'px';
  }));
  miniPhotos.push(m);
}

function finaleHeart(){
  if(activeEl){
    const img = activeEl.querySelector('.photo-card img');
    if(img) spawnMini(img, miniPhotos.length);
    const old = activeEl;
    old.classList.remove('enter','idle'); old.classList.add('exit');
    setTimeout(()=>old.remove(), 1800);
    activeEl = null;
  }
  setTimeout(()=>{
    const n = miniPhotos.length, S = bigSize();
    miniPhotos.forEach((m,i)=>{
      m.style.transitionDelay = (i * 90) + 'ms';
      const p = bigSlot(i, n);
      m.style.left = (p.x - S/2)+'px';
      m.style.top  = (p.y - S/2)+'px';
      m.style.width  = S+'px';
      m.style.height = S+'px';
    });
  }, 350);
  setTimeout(()=>{
    document.body.classList.add('ended');
    startButterflies(); // 🦋 kupu-kupu muncul bersama tulisan
  }, 2600);
}

audio.addEventListener('ended', ()=>{
  finaleHeart();
  btnPlay.innerHTML = ICON_PLAY;
});
document.getElementById('btnReplay').onclick = async ()=>{
  miniPhotos.forEach(m=>m.remove()); miniPhotos.length = 0;
  stopButterflies();
  document.body.classList.remove('ended');
  audio.currentTime=0; await audio.play(); btnPlay.innerHTML=ICON_PAUSE;
};

const fmt = s=>{ s=Math.max(0,Math.floor(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };

function lyricEl(text){
  const d=document.createElement('div'); d.className='lyric';
  text.split(' ').forEach(w=>{ const sp=document.createElement('span');
    sp.className='w'; sp.textContent=w+'\u00A0'; d.appendChild(sp); });
  return d;
}
function buildScene(s){
  const el=document.createElement('div'); el.className='scene enter';
  if(s.text && s.pos==='top') el.appendChild(lyricEl(s.text));
  const card=document.createElement('div'); card.className='photo-card';
  const img=document.createElement('img'); img.src=s.img; card.appendChild(img);
  el.appendChild(card);
  if(s.text && s.pos==='bottom') el.appendChild(lyricEl(s.text));
  stage.appendChild(el); 
  setTimeout(()=>{
    if(el.classList.contains('enter')){ el.classList.remove('enter'); el.classList.add('idle'); }
  }, 1800);
  return el;
}
function switchScene(idx){
  if(activeEl){ 
    const old=activeEl; 
    const img = old.querySelector('.photo-card img');
    if(img) spawnMini(img, miniPhotos.length);
    old.classList.remove('enter', 'idle');
    old.classList.add('exit');
    setTimeout(()=>old.remove(), 1800); 
    activeEl=null; 
  }
  if(idx>=0) activeEl=buildScene(SCENES[idx]);
}
function karaoke(idx,t){
  if(!activeEl || !SCENES[idx].text) return;
  const words=activeEl.querySelectorAll('.w'); if(!words.length) return;
  const s=SCENES[idx], prog=(t-s.start)/(s.end-s.start);
  const at=Math.min(words.length-1, Math.floor(prog*words.length*1.15));
  words.forEach((w,i)=>w.classList.toggle('on', i===at));
}

// ==========================================
// 🎆 KEMBANG API PREMIUM
// ==========================================
const FIREWORK_COLORS = [
  '#ff4d6d', '#ff8fa3', '#ffb3c6', '#ffc8dd',
  '#ff6b9d', '#c9184a', '#ffafcc', '#ff758f',
  '#ffd700', '#ffffff', '#ffb5a7', '#f8ad9d'
];

let fireworks = [];
let particles = [];
let lastShootTime = 0;

class Firework {
  constructor(type) {
    this.type = type;
    this.x = canvas.width * (0.2 + Math.random() * 0.6);
    this.y = canvas.height;
    this.targetY = canvas.height * (0.15 + Math.random() * 0.25);
    this.speed = 7 + Math.random() * 2;
    this.vx = (Math.random() - 0.5) * 1.2;
    this.color = FIREWORK_COLORS[Math.floor(Math.random() * FIREWORK_COLORS.length)];
    this.trail = [];
    this.exploded = false;
  }
  update() {
    if (!this.exploded) {
      this.trail.push({ x: this.x, y: this.y, alpha: 1, size: 3 });
      if (this.trail.length > 12) this.trail.shift();
      this.y -= this.speed;
      this.x += this.vx;
      this.trail.forEach(p => { p.alpha -= 0.08; p.size *= 0.92; });
      if (this.y <= this.targetY) { this.exploded = true; this.explode(); }
    }
  }
  explode() {
    if (this.type === 'peony') {
      for (let i = 0; i < 100; i++) particles.push(new Particle(this.x, this.y, this.color, 'normal'));
      for (let i = 0; i < 8; i++) particles.push(new Particle(this.x, this.y, '#ff4d6d', 'heart'));
    } else if (this.type === 'ring') {
      for (let i = 0; i < 40; i++) {
        const angle = (i / 40) * Math.PI * 2;
        particles.push(new Particle(this.x, this.y, this.color, 'ring', angle, 4 + Math.random()));
      }
      for (let i = 0; i < 20; i++) {
        const angle = (i / 20) * Math.PI * 2;
        particles.push(new Particle(this.x, this.y, '#ffd700', 'ring', angle, 2));
      }
    } else if (this.type === 'willow') {
      for (let i = 0; i < 80; i++) particles.push(new Particle(this.x, this.y, this.color, 'willow'));
    } else if (this.type === 'heart') {
      for (let i = 0; i < 100; i++) {
        const t = (i / 100) * Math.PI * 2;
        const hx = 16 * Math.pow(Math.sin(t), 3);
        const hy = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
        const speed = Math.sqrt(hx*hx + hy*hy) * 0.2;
        particles.push(new Particle(this.x, this.y, this.color, 'ring', Math.atan2(hy, hx), speed));
      }
    }
    for (let i = 0; i < 20; i++) particles.push(new Particle(this.x, this.y, '#ffd700', 'sparkle'));
  }
  draw(ctx) {
    if (!this.exploded) {
      this.trail.forEach(p => {
        if (p.alpha > 0) {
          ctx.save();
          ctx.globalAlpha = p.alpha;
          ctx.fillStyle = this.color;
          ctx.shadowBlur = 12;
          ctx.shadowColor = this.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      });
      ctx.save();
      ctx.fillStyle = '#ffffff';
      ctx.shadowBlur = 20;
      ctx.shadowColor = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, 3.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }
}

class Particle {
  constructor(x, y, color, type = 'normal', angle = null, speed = null) {
    this.x = x; this.y = y; this.color = color; this.type = type;
    if (type === 'ring') { this.vx = Math.cos(angle) * speed; this.vy = Math.sin(angle) * speed; }
    else if (type === 'willow') { const a = Math.random()*Math.PI*2, s = Math.random()*3+1; this.vx = Math.cos(a)*s; this.vy = Math.sin(a)*s; }
    else { const a = Math.random()*Math.PI*2, s = Math.random()*4.5+1; this.vx = Math.cos(a)*s; this.vy = Math.sin(a)*s; }
    this.gravity = type === 'willow' ? 0.06 : (type === 'sparkle' ? 0.03 : 0.04);
    this.alpha = 1;
    this.decay = type === 'sparkle' ? 0.012 : (type === 'willow' ? 0.004 : 0.007 + Math.random()*0.003);
    this.size = type === 'heart' ? 6 : (type === 'sparkle' ? (Math.random()*2+1) : (Math.random()*2.5+1.2));
    this.friction = type === 'willow' ? 0.99 : 0.975;
    this.twinkleSpeed = Math.random()*0.3+0.1;
    this.twinklePhase = Math.random()*Math.PI*2;
    this.hasSecondary = type === 'normal' && Math.random() < 0.1;
    this.age = 0; this.secondaryExploded = false;
    this.rotation = Math.random()*Math.PI*2;
    this.rotationSpeed = (Math.random()-0.5)*0.1;
  }
  update() {
    this.age++;
    this.vx *= this.friction; this.vy *= this.friction;
    this.vy += this.gravity;
    this.x += this.vx; this.y += this.vy;
    this.alpha -= this.decay;
    this.rotation += this.rotationSpeed;
    if (this.hasSecondary && !this.secondaryExploded && this.alpha < 0.5) {
      this.secondaryExploded = true;
      for (let i = 0; i < 8; i++) particles.push(new Particle(this.x, this.y, '#ffd700', 'sparkle'));
    }
  }
  draw(ctx) {
    if (this.alpha <= 0) return;
    const twinkle = this.type === 'sparkle' ? (0.6 + 0.4 * Math.sin(this.age * this.twinkleSpeed + this.twinklePhase)) : 1;
    ctx.save();
    ctx.globalAlpha = Math.max(0, this.alpha) * twinkle;
    ctx.fillStyle = this.color;
    ctx.shadowBlur = this.type === 'sparkle' ? 12 : 8;
    ctx.shadowColor = this.color;
    if (this.type === 'heart') {
      ctx.translate(this.x, this.y); ctx.rotate(this.rotation);
      const s = this.size;
      ctx.beginPath();
      ctx.moveTo(0, s*0.3);
      ctx.bezierCurveTo(0,0,-s,0,-s,s*0.3);
      ctx.bezierCurveTo(-s,s*0.7,0,s*1.2,0,s*1.5);
      ctx.bezierCurveTo(0,s*1.2,s,s*0.7,s,s*0.3);
      ctx.bezierCurveTo(s,0,0,0,0,s*0.3);
      ctx.closePath(); ctx.fill();
    } else if (this.type === 'sparkle') {
      ctx.translate(this.x, this.y); ctx.rotate(this.rotation);
      ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        const r = i % 2 === 0 ? this.size : this.size / 3;
        const ang = (i / 8) * Math.PI * 2;
        const px = Math.cos(ang)*r, py = Math.sin(ang)*r;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath(); ctx.fill();
    } else {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }
}

function shootFirework() {
  const types = ['peony', 'peony', 'ring', 'willow', 'heart'];
  fireworks.push(new Firework(types[Math.floor(Math.random() * types.length)]));
  if (Math.random() > 0.7) {
    setTimeout(() => {
      if (audio.currentTime >= FIREWORK_START && audio.currentTime <= FIREWORK_END) {
        fireworks.push(new Firework(types[Math.floor(Math.random() * types.length)]));
      }
    }, 150);
  }
}

// ==========================================
// 🦋 KUPU-KUPU FINALE (muncul bersama "I Always Love You")
// ==========================================
const BUTTERFLY_COLORS = [
  '#ff8fa3', '#ffc8dd', '#c77dff', '#e0aaff',
  '#ffd700', '#ffffff', '#ff6b9d', '#a2d2ff'
];
let butterflies = [];
let butterfliesActive = false;

class Butterfly {
  constructor(delay) {
    this.delay = delay || 0;      // muncul berurutan (stagger)
    this.alpha = 0;
    this.x = Math.random() * canvas.width;
    this.y = canvas.height * 0.25 + Math.random() * canvas.height * 0.85;
    this.size = 9 + Math.random() * 13;
    this.color = BUTTERFLY_COLORS[Math.floor(Math.random() * BUTTERFLY_COLORS.length)];
    this.flap = Math.random() * Math.PI * 2;
    this.flapSpeed = 0.22 + Math.random() * 0.14;
    this.wander = Math.random() * Math.PI * 2;
    this.speed = 0.7 + Math.random() * 0.9;
    this.dir = Math.random() * Math.PI * 2;
  }
  update() {
    if (this.delay > 0) { this.delay--; return; }
    if (this.alpha < 0.95) this.alpha += 0.02;
    this.flap += this.flapSpeed;
    this.wander += 0.015 + Math.random() * 0.02;
    this.dir += Math.sin(this.wander) * 0.06;          // belok halus
    this.x += Math.cos(this.dir) * this.speed;
    this.y += Math.sin(this.dir) * this.speed * 0.7 - 0.25; // melayang naik
    // wrap di tepi layar
    if (this.y < -40) { this.y = canvas.height + 30; this.x = Math.random() * canvas.width; }
    if (this.x < -40) this.x = canvas.width + 30;
    if (this.x > canvas.width + 40) this.x = -30;
    if (this.y > canvas.height + 60) this.y = -30;
  }
  draw(ctx) {
    if (this.delay > 0 || this.alpha <= 0) return;
    const f = Math.sin(this.flap);                    // kepakan -1..1
    const wingX = 0.35 + 0.65 * Math.abs(f);          // sayap melipat
    const lift = f * 0.25;
    const s = this.size;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(Math.sin(this.wander) * 0.2);
    ctx.globalAlpha = this.alpha;
    ctx.shadowBlur = 14;
    ctx.shadowColor = this.color;
    ctx.fillStyle = this.color;

    // sayap kiri (atas + bawah)
    ctx.save();
    ctx.scale(wingX, 1);
    ctx.beginPath();
    ctx.ellipse(-s*0.55, -s*0.30 - lift*s, s*0.62, s*0.45, -0.5, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(-s*0.42, s*0.28, s*0.42, s*0.32, -0.9, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();

    // sayap kanan (atas + bawah)
    ctx.save();
    ctx.scale(wingX, 1);
    ctx.beginPath();
    ctx.ellipse(s*0.55, -s*0.30 - lift*s, s*0.62, s*0.45, 0.5, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(s*0.42, s*0.28, s*0.42, s*0.32, 0.9, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();

    // tubuh kecil bercahaya
    ctx.shadowBlur = 6;
    ctx.shadowColor = '#ffffff';
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    ctx.beginPath();
    ctx.ellipse(0, 0, s*0.12, s*0.42, 0, 0, Math.PI*2);
    ctx.fill();

    ctx.restore();
  }
}

function startButterflies() {
  if (butterfliesActive) return;
  butterfliesActive = true;
  for (let i = 0; i < 18; i++) {
    butterflies.push(new Butterfly(i * 12)); // muncul satu-satu
  }
}
function stopButterflies() {
  butterfliesActive = false;
  butterflies = [];
}

// ===== LOOP ANIMASI GABUNGAN (kembang api + kupu-kupu) =====
function animateFireworks() {
  ctx.globalCompositeOperation = 'destination-out';
  ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.globalCompositeOperation = 'source-over';

  const t = audio.currentTime;
  const isActive = started && !audio.paused && t >= FIREWORK_START && t <= FIREWORK_END;

  if (isActive) {
    const now = performance.now();
    if (now - lastShootTime > 350 + Math.random() * 250) {
      shootFirework();
      lastShootTime = now;
    }
  }

  for (let i = fireworks.length - 1; i >= 0; i--) {
    fireworks[i].update();
    fireworks[i].draw(ctx);
    if (fireworks[i].exploded) fireworks.splice(i, 1);
  }
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw(ctx);
    if (particles[i].alpha <= 0) particles.splice(i, 1);
  }
  if (butterfliesActive) {
    for (const b of butterflies) { b.update(); b.draw(ctx); }
  }
  requestAnimationFrame(animateFireworks);
}
animateFireworks();

(function loop(){
  const t=audio.currentTime;
  tCur.textContent=fmt(t);
  const dur=isFinite(audio.duration)?audio.duration:0;
  tRem.textContent=dur? '-'+fmt(dur-t) : '-0:00';
  barFill.style.width=dur? (t/dur*100)+'%':'0%';
  if(started){
    const idx=SCENES.findIndex(s=>t>=s.start && t<s.end);
    if(idx!==current){ switchScene(idx); current=idx; }
    if(idx>=0) karaoke(idx,t);
  }
  requestAnimationFrame(loop);
})();
</script>
